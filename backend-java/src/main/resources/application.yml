# Credentials come only from DB_URL, DB_USERNAME, and DB_PASSWORD.
spring:
  application:
    name: reconciliation
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
